substitutions:
  device_name: buiten_voordeur
  friendly_name: Voordeur

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  
esp8266:
  board: d1_mini

external_components:
- source: github://hencou/esphome_components
  components: dcf77
  
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  fast_connect: true

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
 
ota:

time:   
- platform: dcf77
    id: dcftime
    pin:
      number: GPIO3
      inverted: true  # only needed if wired through an opto-isolated input
    timezone: "Europe/Amsterdam"
    on_time_sync:
      then:
        - logger.log: "Synchronized system clock via DCF77"
  on_time:
    - hours: 7
      then:
        if:
          condition:
            sensor.in_range:
              id: ldr
              below: 210
          then:
            light.turn_on: light1
    - hours: 0
      then:
        light.turn_off: light1

text_sensor:
  - platform: template
    name: "DCF77 Datetime"
    update_interval: 60s
    lambda: |-
      return id(dcftime).now().strftime("%Y-%m-%d %H:%M");
